<!DOCTYPE html>
<style>
  .spa-loading-screen {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fafbfc;
    font-family: system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    .spa-loading-screen {
      background: #0a191c;
      color: #ffffff;
    }
  }
  .spa-spinner-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  .spa-orbit {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    animation: spa-spin 2s linear infinite;
  }
  .spa-progress {
    width: 140px;
    height: 3px;
    background: rgba(0, 162, 181, 0.15);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    margin-top: 16px;
  }
  .spa-progress-bar {
    position: absolute;
    height: 100%;
    width: 40%;
    background: #00a2b5;
    border-radius: 999px;
    animation: spa-slide 1.4s ease-in-out infinite;
  }
  @keyframes spa-spin {
    100% {
      transform: rotate(360deg);
    }
  }
  @keyframes spa-slide {
    0% {
      transform: translateX(-120%);
    }
    100% {
      transform: translateX(300%);
    }
  }
</style>
<div class="spa-loading-screen" id="spa-loading">
  <div class="spa-spinner-wrap">
    <svg class="spa-orbit" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" stroke="#00a2b5" stroke-width="3" stroke-linecap="round" stroke-dasharray="100 180" fill="none" />
    </svg>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="#00a2b5">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15-5-5 1.41-1.41L11 14.17l7.59-7.59L20 8l-9 9z" />
    </svg>
  </div>
  <div class="spa-progress">
    <div class="spa-progress-bar"></div>
  </div>
</div>
